<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Show in Large Type</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f7;
        padding: 40px 20px;
        min-height: 100vh;
      }

      .container {
        max-width: 980px;
        margin: 0 auto;
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }

      h1 {
        font-size: 28px;
        margin-bottom: 8px;
        color: #1d1d1f;
        font-weight: 600;
      }

      .subtitle {
        font-size: 14px;
        color: #666;
        margin-bottom: 32px;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #1d1d1f;
      }

      textarea,
      input {
        width: 100%;
        padding: 12px;
        background: #fafafa;
        border: 1px solid #d2d2d7;
        border-radius: 8px;
        color: #1d1d1f;
        font: inherit;
        outline: none;
        transition:
          border-color 0.2s,
          background 0.2s;
      }

      textarea {
        min-height: 120px;
        margin-bottom: 20px;
        resize: vertical;
        font-family: "SF Mono", Monaco, monospace;
        font-size: 15px;
        line-height: 1.6;
      }

      input {
        max-width: 160px;
        font-size: 16px;
      }

      textarea:focus,
      input:focus {
        border-color: #0071e3;
        background: #fff;
      }

      .large-type {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
        gap: 12px;
        padding-top: 4px;
      }

      .character-card {
        min-height: 132px;
        border: 1px solid #d2d2d7;
        border-radius: 8px;
        background: #fbfbfd;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .index {
        color: #666;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .character {
        color: #1d1d1f;
        font-family: "SF Mono", Monaco, monospace;
        font-size: 64px;
        font-weight: 700;
        line-height: 1;
        max-width: 100%;
        padding: 0 10px;
        overflow-wrap: anywhere;
      }

      .character.space {
        color: #86868b;
        font-size: 22px;
      }

      .empty-state {
        padding: 40px 20px;
        color: #666;
        text-align: center;
        background: #f5f5f7;
        border-radius: 8px;
      }

      footer {
        margin-top: 40px;
        padding-top: 20px;
        text-align: center;
        color: #666;
        font-size: 14px;
      }

      footer a {
        color: #0071e3;
        text-decoration: none;
        margin: 0 10px;
      }

      footer a:hover {
        text-decoration: underline;
      }

      @media (max-width: 768px) {
        body {
          padding: 20px 12px;
        }

        .container {
          padding: 24px 20px;
        }

        h1 {
          font-size: 24px;
        }

        .large-type {
          grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
          gap: 10px;
        }

        .character-card {
          min-height: 108px;
        }

        .character {
          font-size: 48px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Show in Large Type</h1>
      <div class="subtitle">
        Split text into large indexed characters so positions are easy to read.
      </div>

      <label for="input">Text</label>
      <textarea
        id="input"
        placeholder="Paste text here, for example: example"
        spellcheck="false"
      ></textarea>

      <div id="largeType" class="large-type">
        <div class="empty-state">Characters will appear here.</div>
      </div>
    </div>

    <script>
      const input = document.getElementById("input");
      const largeType = document.getElementById("largeType");

      function getDisplayCharacter(character) {
        if (character === " ") return "space";
        if (character === "\n") return "line break";
        if (character === "\t") return "tab";
        return character;
      }

      function render() {
        const characters = Array.from(input.value);

        largeType.innerHTML = "";

        if (characters.length === 0) {
          largeType.innerHTML =
            '<div class="empty-state">Characters will appear here.</div>';
          return;
        }

        characters.forEach((character, index) => {
          const card = document.createElement("div");
          const cardPosition = index + 1;
          card.className = "character-card";

          const indexElement = document.createElement("div");
          indexElement.className = "index";
          indexElement.textContent = cardPosition;

          const characterElement = document.createElement("div");
          characterElement.className =
            character === " " || character === "\n" || character === "\t"
              ? "character space"
              : "character";
          characterElement.textContent = getDisplayCharacter(character);

          card.append(indexElement, characterElement);
          largeType.appendChild(card);
        });
      }

      input.addEventListener("input", render);
      render();
    </script>

    <footer>
      <a href="../index.html">Home</a> |
      <a
        href="https://github.com/kzuraw/tools/blob/main/html/show-in-large-type.html"
        >Source Code</a
      >
      |
      <a href="https://kzuraw.com">kzuraw.com</a>
    </footer>
  </body>
</html>

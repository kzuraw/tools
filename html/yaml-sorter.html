<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAML Sorter</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"
      integrity="sha512-CSBhVREyzHAjAFfBlIBakjoRUKp5h7VSweP0InR/pAJyptH7peuhCsqAI/snV+TwZmXZqoUAZpXAN8x1ouSiQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        background: #f5f5f7;
        color: #1d1d1f;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 20px 32px 16px;
        display: flex;
        align-items: baseline;
        gap: 12px;
      }

      header h1 {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.3px;
        color: #1d1d1f;
      }

      header span {
        font-size: 13px;
        color: #86868b;
      }

      .main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        padding: 0 24px 24px;
        min-height: 0;
      }

      .pane {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .pane-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #86868b;
        padding: 0 4px;
      }

      .pane:first-child {
        padding-right: 12px;
      }

      .pane:last-child {
        padding-left: 12px;
      }

      textarea {
        flex: 1;
        resize: none;
        border: 1px solid #d2d2d7;
        border-radius: 12px;
        padding: 16px;
        font-family: "SF Mono", "Menlo", "Monaco", "Courier New", monospace;
        font-size: 13px;
        line-height: 1.6;
        color: #1d1d1f;
        background: #ffffff;
        outline: none;
        transition: border-color 0.15s ease;
        min-height: calc(100vh - 160px);
      }

      textarea:focus {
        border-color: #0071e3;
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
      }

      textarea[readonly] {
        background: #fafafa;
        color: #1d1d1f;
        cursor: default;
      }

      textarea[readonly]:focus {
        border-color: #d2d2d7;
        box-shadow: none;
      }

      .pane-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4px;
      }

      .status {
        font-size: 11px;
        font-weight: 500;
        padding: 2px 8px;
        border-radius: 20px;
      }

      .status.ok {
        color: #1d7e4a;
        background: #d4f0e2;
      }

      .status.error {
        color: #c0392b;
        background: #fde8e8;
      }

      .status.empty {
        color: #86868b;
      }

      .copy-btn {
        font-size: 12px;
        font-weight: 500;
        color: #0071e3;
        background: none;
        border: none;
        cursor: pointer;
        padding: 2px 6px;
        border-radius: 6px;
        transition: background 0.12s;
        font-family: inherit;
      }

      .copy-btn:hover {
        background: rgba(0, 113, 227, 0.1);
      }

      .copy-btn:active {
        background: rgba(0, 113, 227, 0.2);
      }

      .copy-btn.copied {
        color: #1d7e4a;
      }

      .divider {
        width: 1px;
        background: #d2d2d7;
        margin: 0;
        align-self: stretch;
      }

      .options {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 28px 12px;
      }

      .options label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: #3d3d3f;
        cursor: pointer;
        user-select: none;
      }

      .options input[type="checkbox"] {
        width: 14px;
        height: 14px;
        accent-color: #0071e3;
        cursor: pointer;
      }

      .options-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #86868b;
        margin-right: 4px;
      }

      footer {
        text-align: center;
        padding: 16px;
        font-size: 14px;
        color: #86868b;
      }

      footer a {
        color: #0071e3;
        text-decoration: none;
        margin: 0 10px;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>YAML Sorter</h1>
      <span>Sorts top-level keys alphabetically</span>
    </header>

    <div class="options">
      <span class="options-label">Options</span>
      <label>
        <input type="checkbox" id="deepSort" /> Deep sort (nested keys)
      </label>
      <label>
        <input type="checkbox" id="lineWidth" /> Preserve line width
      </label>
    </div>

    <div class="main">
      <div class="pane">
        <div class="pane-header">
          <span class="pane-label">Input</span>
          <span class="status empty" id="inputStatus">—</span>
        </div>
        <textarea
          id="input"
          placeholder="Paste your YAML here…"
          spellcheck="false"
        ></textarea>
      </div>

      <div class="pane">
        <div class="pane-header">
          <span class="pane-label">Sorted</span>
          <div style="display: flex; align-items: center; gap: 10px">
            <span class="status empty" id="outputStatus">—</span>
            <button class="copy-btn" id="copyBtn">Copy</button>
          </div>
        </div>
        <textarea
          id="output"
          readonly
          placeholder="Sorted YAML will appear here…"
          spellcheck="false"
        ></textarea>
      </div>
    </div>

    <script type="module">
      const input = document.getElementById("input");
      const output = document.getElementById("output");
      const inputStatus = document.getElementById("inputStatus");
      const outputStatus = document.getElementById("outputStatus");
      const copyBtn = document.getElementById("copyBtn");
      const deepSortCb = document.getElementById("deepSort");
      const lineWidthCb = document.getElementById("lineWidth");

      function sortKeys(obj, deep) {
        if (typeof obj !== "object" || obj === null || Array.isArray(obj))
          return obj;
        const sorted = {};
        Object.keys(obj)
          .sort((a, b) =>
            a.localeCompare(b, undefined, { sensitivity: "base" }),
          )
          .forEach((key) => {
            sorted[key] = deep ? sortKeys(obj[key], deep) : obj[key];
          });
        return sorted;
      }

      function process() {
        const raw = input.value.trim();
        if (!raw) {
          inputStatus.textContent = "—";
          inputStatus.className = "status empty";
          outputStatus.textContent = "—";
          outputStatus.className = "status empty";
          output.value = "";
          return;
        }

        try {
          const parsed = jsyaml.load(raw);
          if (
            typeof parsed !== "object" ||
            parsed === null ||
            Array.isArray(parsed)
          ) {
            inputStatus.textContent = "Not a mapping";
            inputStatus.className = "status error";
            output.value = jsyaml.dump(parsed, { lineWidth: -1 });
            outputStatus.textContent = "No keys to sort";
            outputStatus.className = "status empty";
            return;
          }
          const keyCount = Object.keys(parsed).length;
          inputStatus.textContent = `${keyCount} key${keyCount !== 1 ? "s" : ""}`;
          inputStatus.className = "status ok";

          const deep = deepSortCb.checked;
          const sorted = sortKeys(parsed, deep);

          const dumpOpts = {
            lineWidth: lineWidthCb.checked ? 80 : -1,
            noRefs: true,
            sortKeys: false,
          };

          output.value = jsyaml.dump(sorted, dumpOpts);
          outputStatus.textContent = "Sorted";
          outputStatus.className = "status ok";
        } catch (e) {
          inputStatus.textContent = "Invalid YAML";
          inputStatus.className = "status error";
          outputStatus.textContent = "—";
          outputStatus.className = "status empty";
          output.value = "";
        }
      }

      input.addEventListener("input", process);
      deepSortCb.addEventListener("change", process);
      lineWidthCb.addEventListener("change", process);

      copyBtn.addEventListener("click", () => {
        if (!output.value) return;
        navigator.clipboard.writeText(output.value).then(
          () => {
            copyBtn.textContent = "Copied!";
            copyBtn.classList.add("copied");
            setTimeout(() => {
              copyBtn.textContent = "Copy";
              copyBtn.classList.remove("copied");
            }, 1500);
          },
          () => {
            copyBtn.textContent = "Failed!";
            setTimeout(() => {
              copyBtn.textContent = "Copy";
            }, 1500);
          },
        );
      });
    </script>

    <footer>
      <a href="../index.html">Home</a> |
      <a href="https://github.com/kzuraw/tools/blob/main/html/yaml-sorter.html"
        >Source Code</a
      >
      |
      <a href="https://kzuraw.com">kzuraw.com</a>
    </footer>
  </body>
</html>

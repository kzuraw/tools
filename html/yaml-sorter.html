<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YAML Sorter</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"
      integrity="sha512-CSBhVREyzHAjAFfBlIBakjoRUKp5h7VSweP0InR/pAJyptH7peuhCsqAI/snV+TwZmXZqoUklpXp6R6wMnYf5Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f5f7;
        padding: 40px 20px;
        min-height: 100vh;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 32px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #1d1d1f;
      }

      .subtitle {
        color: #6e6e73;
        margin-bottom: 24px;
        font-size: 15px;
      }

      .options {
        display: flex;
        gap: 20px;
        margin-bottom: 24px;
      }

      .options label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        color: #1d1d1f;
        cursor: pointer;
        user-select: none;
      }

      .options input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: #0071e3;
        cursor: pointer;
      }

      label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #1d1d1f;
      }

      textarea {
        width: 100%;
        min-height: 200px;
        padding: 12px;
        border: 1px solid #d2d2d7;
        border-radius: 8px;
        font-family: "SF Mono", Monaco, monospace;
        font-size: 13px;
        line-height: 1.6;
        resize: vertical;
        margin-bottom: 16px;
        transition: border-color 0.2s;
      }

      textarea:focus {
        outline: none;
        border-color: #0071e3;
      }

      #output {
        background: #f5f5f7;
      }

      .status {
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .status.ok {
        color: #34c759;
      }

      .status.error {
        color: #ff3b30;
      }

      .status.empty {
        color: #86868b;
      }

      .button-group {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }

      button {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
      }

      .primary {
        background: #0071e3;
        color: white;
      }

      .primary:hover {
        background: #0077ed;
      }

      .success {
        background: #34c759;
        color: white;
      }

      .secondary {
        background: #e8e8ed;
        color: #1d1d1f;
      }

      .secondary:hover {
        background: #d2d2d7;
      }

      footer {
        margin-top: 40px;
        padding-top: 20px;
        text-align: center;
        color: #666;
        font-size: 14px;
      }

      footer a {
        color: #0071e3;
        text-decoration: none;
        margin: 0 10px;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>YAML Sorter</h1>
      <p class="subtitle">Sort YAML keys alphabetically</p>

      <div class="options">
        <label>
          <input type="checkbox" id="deepSort" /> Deep sort (nested keys)
        </label>
        <label>
          <input type="checkbox" id="lineWidth" /> Wrap at 80 chars
        </label>
      </div>

      <label for="input">Paste YAML</label>
      <div class="status empty" id="inputStatus"></div>
      <textarea
        id="input"
        placeholder="Paste your YAML here…"
        spellcheck="false"
      ></textarea>

      <label for="output">Sorted Output</label>
      <div class="status empty" id="outputStatus"></div>
      <textarea
        id="output"
        readonly
        placeholder="Sorted YAML will appear here…"
        spellcheck="false"
      ></textarea>

      <div class="button-group">
        <button class="primary" id="copyBtn">Copy to Clipboard</button>
        <button class="secondary" id="clearBtn">Clear</button>
      </div>
    </div>

    <script>
      const input = document.getElementById("input");
      const output = document.getElementById("output");
      const inputStatus = document.getElementById("inputStatus");
      const outputStatus = document.getElementById("outputStatus");
      const copyBtn = document.getElementById("copyBtn");
      const clearBtn = document.getElementById("clearBtn");
      const deepSortCb = document.getElementById("deepSort");
      const lineWidthCb = document.getElementById("lineWidth");

      function sortKeys(obj, deep) {
        if (typeof obj !== "object" || obj === null || Array.isArray(obj))
          return obj;
        const sorted = {};
        Object.keys(obj)
          .sort((a, b) =>
            a.localeCompare(b, undefined, { sensitivity: "base" }),
          )
          .forEach((key) => {
            sorted[key] = deep ? sortKeys(obj[key], deep) : obj[key];
          });
        return sorted;
      }

      function process() {
        const raw = input.value.trim();
        if (!raw) {
          inputStatus.textContent = "";
          inputStatus.className = "status empty";
          outputStatus.textContent = "";
          outputStatus.className = "status empty";
          output.value = "";
          return;
        }

        if (typeof jsyaml === "undefined") {
          inputStatus.textContent =
            "Failed to load YAML library — check your network or adblocker";
          inputStatus.className = "status error";
          output.value = "";
          return;
        }

        try {
          const sanitized = raw.replace(/\t/g, "  ");
          const parsed = jsyaml.load(sanitized);
          if (
            typeof parsed !== "object" ||
            parsed === null ||
            Array.isArray(parsed)
          ) {
            inputStatus.textContent = "Not a mapping";
            inputStatus.className = "status error";
            output.value = jsyaml.dump(parsed, { lineWidth: -1 });
            outputStatus.textContent = "No keys to sort";
            outputStatus.className = "status empty";
            return;
          }
          const keyCount = Object.keys(parsed).length;
          inputStatus.textContent = `${keyCount} key${keyCount !== 1 ? "s" : ""} found`;
          inputStatus.className = "status ok";

          const deep = deepSortCb.checked;
          const sorted = sortKeys(parsed, deep);

          const dumpOpts = {
            lineWidth: lineWidthCb.checked ? 80 : -1,
            noRefs: true,
            sortKeys: false,
          };

          output.value = jsyaml.dump(sorted, dumpOpts);
          outputStatus.textContent = "Sorted";
          outputStatus.className = "status ok";
        } catch (e) {
          inputStatus.textContent = e.message || "Invalid YAML";
          inputStatus.className = "status error";
          outputStatus.textContent = "";
          outputStatus.className = "status empty";
          output.value = "";
        }
      }

      input.addEventListener("input", process);
      deepSortCb.addEventListener("change", process);
      lineWidthCb.addEventListener("change", process);

      copyBtn.addEventListener("click", async () => {
        if (!output.value) return;
        try {
          await navigator.clipboard.writeText(output.value);
          const originalText = copyBtn.textContent;
          copyBtn.textContent = "Copied!";
          copyBtn.classList.remove("primary");
          copyBtn.classList.add("success");
          setTimeout(() => {
            copyBtn.textContent = originalText;
            copyBtn.classList.remove("success");
            copyBtn.classList.add("primary");
          }, 2000);
        } catch (err) {
          copyBtn.textContent = "Failed!";
          setTimeout(() => {
            copyBtn.textContent = "Copy to Clipboard";
          }, 2000);
        }
      });

      clearBtn.addEventListener("click", () => {
        input.value = "";
        output.value = "";
        inputStatus.textContent = "";
        inputStatus.className = "status empty";
        outputStatus.textContent = "";
        outputStatus.className = "status empty";
      });
    </script>

    <footer>
      <a href="../index.html">Home</a> |
      <a href="https://github.com/kzuraw/tools/blob/main/html/yaml-sorter.html"
        >Source Code</a
      >
      |
      <a href="https://kzuraw.com">kzuraw.com</a>
    </footer>
  </body>
</html>

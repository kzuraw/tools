<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mailto Link Generator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛠️</text></svg>"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f7;
        padding: 40px 20px;
        min-height: 100vh;
      }

      .container {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      h1 {
        color: #1d1d1f;
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .intro {
        color: #6e6e73;
        font-size: 15px;
        margin-bottom: 24px;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        color: #1d1d1f;
        font-size: 14px;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .hint {
        color: #86868b;
        font-size: 12px;
        font-weight: 400;
      }

      input,
      textarea {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid #d2d2d7;
        border-radius: 8px;
        color: #1d1d1f;
        font: inherit;
        font-size: 16px;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      input:focus,
      textarea:focus {
        border-color: #0071e3;
        box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.15);
      }

      .output {
        margin-top: 28px;
        padding: 16px;
        background: #f5f5f7;
        border-radius: 8px;
      }

      .output-label {
        color: #86868b;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
        text-transform: uppercase;
      }

      #result {
        min-height: 48px;
        color: #1d1d1f;
        font-family: "SF Mono", SFMono-Regular, Menlo, Monaco, monospace;
        font-size: 13px;
        line-height: 1.5;
        overflow-wrap: anywhere;
      }

      .button-group {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 14px;
      }

      button,
      .open-link {
        padding: 11px 16px;
        border: none;
        border-radius: 8px;
        background: #0071e3;
        color: white;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.2s;
      }

      button:hover,
      .open-link:hover {
        background: #0077ed;
      }

      button:disabled {
        background: #d2d2d7;
        cursor: not-allowed;
      }

      .open-link[aria-disabled="true"] {
        display: none;
      }

      footer {
        margin-top: 40px;
        padding-top: 20px;
        color: #666;
        font-size: 14px;
        text-align: center;
      }

      footer a {
        margin: 0 10px;
        color: #0071e3;
        text-decoration: none;
      }

      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <h1>Mailto Link Generator</h1>
      <p class="intro">
        Create a pre-filled email link without sending any data to a server.
      </p>

      <div class="field">
        <label for="to"
          >To <span class="hint">(separate addresses with commas)</span></label
        >
        <input
          id="to"
          type="text"
          inputmode="email"
          placeholder="hello@example.com, team@example.com"
          autofocus
        />
      </div>

      <div class="field">
        <label for="cc">CC <span class="hint">(optional)</span></label>
        <input
          id="cc"
          type="text"
          inputmode="email"
          placeholder="manager@example.com"
        />
      </div>

      <div class="field">
        <label for="bcc">BCC <span class="hint">(optional)</span></label>
        <input
          id="bcc"
          type="text"
          inputmode="email"
          placeholder="archive@example.com"
        />
      </div>

      <div class="field">
        <label for="subject"
          >Subject <span class="hint">(optional)</span></label
        >
        <input id="subject" type="text" placeholder="Your subject" />
      </div>

      <div class="field">
        <label for="body">Body <span class="hint">(optional)</span></label>
        <textarea id="body" placeholder="Your message"></textarea>
      </div>

      <section class="output" aria-live="polite">
        <div class="output-label">Generated Mailto Link</div>
        <div id="result">Enter a recipient to generate a link.</div>
        <div class="button-group">
          <button id="copyBtn" type="button" disabled>Copy Link</button>
          <a id="openLink" class="open-link" href="#" aria-disabled="true"
            >Open Email</a
          >
        </div>
      </section>
    </main>

    <footer>
      <a href="../index.html">Home</a> |
      <a
        href="https://github.com/kzuraw/tools/blob/main/html/mailto-link-generator.html"
        >Source Code</a
      >
      |
      <a href="https://kzuraw.com">kzuraw.com</a>
    </footer>

    <script>
      const fields = ["to", "cc", "bcc", "subject", "body"].map((id) =>
        document.getElementById(id),
      );
      const [toInput, ccInput, bccInput, subjectInput, bodyInput] = fields;
      const result = document.getElementById("result");
      const copyBtn = document.getElementById("copyBtn");
      const openLink = document.getElementById("openLink");
      let mailtoLink = "";

      function normalizeAddresses(value) {
        return value
          .split(",")
          .map((address) => address.trim())
          .filter(Boolean)
          .join(",");
      }

      function generateLink() {
        const to = normalizeAddresses(toInput.value);
        const params = [];
        const cc = normalizeAddresses(ccInput.value);
        const bcc = normalizeAddresses(bccInput.value);

        if (cc) params.push(`cc=${encodeURIComponent(cc)}`);
        if (bcc) params.push(`bcc=${encodeURIComponent(bcc)}`);
        if (subjectInput.value)
          params.push(`subject=${encodeURIComponent(subjectInput.value)}`);
        if (bodyInput.value)
          params.push(`body=${encodeURIComponent(bodyInput.value)}`);

        const recipients = to
          .split(",")
          .map((address) => encodeURIComponent(address))
          .join(",");
        mailtoLink = to
          ? `mailto:${recipients}${params.length ? `?${params.join("&")}` : ""}`
          : "";
        result.textContent =
          mailtoLink || "Enter a recipient to generate a link.";
        copyBtn.disabled = !mailtoLink;
        openLink.href = mailtoLink || "#";
        openLink.setAttribute("aria-disabled", String(!mailtoLink));
      }

      fields.forEach((field) => field.addEventListener("input", generateLink));

      copyBtn.addEventListener("click", async () => {
        await navigator.clipboard.writeText(mailtoLink);
        copyBtn.textContent = "Copied!";
        setTimeout(() => (copyBtn.textContent = "Copy Link"), 1500);
      });

      generateLink();
    </script>
  </body>
</html>
